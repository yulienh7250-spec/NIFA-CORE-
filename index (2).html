<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nifa Animation Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0c; --card:#17171b; --border:#2c2c33; --muted:#c9c9d0; --accent:#7c3aed; --accent2:#a78bfa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Sora',system-ui,sans-serif; background:var(--bg); color:#fff; min-height:100vh; }
  #bg { position:fixed; inset:0; z-index:0; }
  .hidden { display:none !important; }

  /* ---------- ROBOT ---------- */
  .robot { overflow:visible; animation:float 3.2s ease-in-out infinite; filter:drop-shadow(0 8px 14px rgba(124,58,237,.55)); }
  @keyframes float { 0%,100% { transform:translateY(0) rotate(-1.5deg); } 50% { transform:translateY(-7px) rotate(1.5deg); } }
  .robot .eye { transform-box:fill-box; transform-origin:center; animation:blink 4s infinite; }
  @keyframes blink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
  .robot .ant { animation:glow 1.6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  .robot .arm-l { transform-box:fill-box; transform-origin:top center; animation:wave 2.4s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-14deg); } }
  @media (prefers-reduced-motion:reduce) { .robot, .robot * { animation:none !important; } }

  /* ---------- LOGIN ---------- */
  #loginView { position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border);
    border-bottom:5px solid var(--accent); border-radius:28px; padding:40px 28px 32px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .logo { display:flex; justify-content:center; }
  .logo .robot { width:110px; height:120px; }
  h1 { text-align:center; font-size:28px; font-weight:800; line-height:1.25; margin:8px 0 12px; }
  h1 span { color:var(--accent); }
  h1 small.ml { display:block; font-size:15px; font-weight:600; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:10px; }
  .sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:32px; }
  label.t { display:block; font-weight:600; margin-bottom:10px; }
  .field { position:relative; margin-bottom:24px; }
  input[type=email], input[type=password], input[type=text] { width:100%; padding:16px 18px; background:var(--bg); color:#fff;
    border:2px solid var(--border); border-radius:18px; font:inherit; font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,58,237,.25); }
  .eye { position:absolute; right:16px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; }
  .remember { display:flex; align-items:center; gap:12px; margin-bottom:28px; color:var(--muted); }
  .remember input { width:22px; height:22px; accent-color:var(--accent); }
  .btn { width:100%; padding:16px; background:var(--accent); color:#fff; border:0; border-radius:18px;
    font:inherit; font-weight:800; font-size:17px; cursor:pointer; box-shadow:0 8px 24px rgba(124,58,237,.35); }
  .btn:active { transform:scale(.98); }
  hr { border:0; border-top:1px solid var(--muted); opacity:.5; margin:32px 0 24px; }
  .links { text-align:center; color:var(--muted); line-height:2; }
  .links a { color:var(--accent2); font-weight:800; text-decoration:none; }
  #msg { text-align:center; color:#ff6b6b; font-size:14px; min-height:18px; margin-bottom:12px; }

  /* ---------- DASHBOARD ---------- */
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; background:rgba(21,21,25,.95); border-bottom:1px solid var(--border); }
  .brand { font-weight:800; display:flex; align-items:center; gap:10px; }
  .brand .robot { width:38px; height:42px; }
  .brand b { color:var(--accent); }
  .brand .bt { font-size:19px; line-height:1.1; }
  .brand .bt small { display:block; font-size:11px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
  .user { position:relative; }
  .avatar { display:flex; align-items:center; gap:6px; background:none; border:0; color:#fff; cursor:pointer; font:inherit; }
  .pic { width:46px; height:46px; border-radius:50%; border:3px solid var(--accent); display:grid; place-items:center;
    background:#1a1030; font-weight:800; color:var(--accent2); font-size:18px; }
  .menu { display:none; position:absolute; right:0; top:58px; min-width:170px; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .menu.open { display:block; }
  .menu button { display:block; width:100%; text-align:left; padding:14px 16px; color:#fff; background:none; border:0; font:inherit; cursor:pointer; }
  .menu button:hover { background:#222228; }

  main { position:relative; z-index:1; max-width:720px; margin:0 auto; padding:22px 16px 60px; }

  .welcome { background:linear-gradient(135deg,#2e1065,#4c1d95 60%,#6d28d9); border-radius:24px; padding:26px 22px; margin-bottom:26px;
    box-shadow:0 12px 40px rgba(124,58,237,.3); }
  .welcome h2 { font-size:22px; font-weight:800; line-height:1.3; }
  .welcome p { margin-top:10px; font-size:14px; line-height:1.6; color:#ede9fe; }
  .welcome .who { margin-top:14px; font-size:12px; color:#ddd6fe; opacity:.85; word-break:break-all; }

  .sec { font-size:18px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .sec span { font-size:12px; font-weight:600; color:var(--muted); background:#1f1633; border:1px solid #4c2f8a; padding:4px 10px; border-radius:20px; }

  .mod { background:var(--card); border:2px solid var(--border); border-radius:22px; margin-bottom:14px; overflow:hidden; transition:border-color .2s; }
  .mod.open { border-color:var(--accent); }
  .mhead { width:100%; display:flex; align-items:center; gap:14px; padding:18px; background:none; border:0; color:#fff; font:inherit; text-align:left; cursor:pointer; }
  .num { flex:none; background:#1f1633; color:var(--accent2); border:1px solid #4c2f8a; border-radius:12px; padding:8px 12px; font-weight:800; font-size:13px; letter-spacing:1px; }
  .mtitle { flex:1; font-weight:800; font-size:17px; line-height:1.3; }
  .mtitle em { display:block; font-style:normal; font-weight:600; font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:1px; text-transform:uppercase; }
  .chev { flex:none; color:var(--accent2); font-size:18px; transition:transform .2s; }
  .mod.open .chev { transform:rotate(180deg); }
  .mbody { display:none; padding:0 18px 20px; }
  .mod.open .mbody { display:block; }
  .mdesc { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:18px; }
  .blk { margin-bottom:18px; }
  .blk h4 { font-size:14px; font-weight:800; margin-bottom:10px; color:#ddd6fe; }
  .result { aspect-ratio:16/9; border-radius:16px; display:grid; place-items:center; text-align:center; padding:12px; color:#ddd6fe; font-size:13px;
    background:linear-gradient(135deg,#2e1065,#6d28d9); background-size:cover; background-position:center; border:1px solid #4c2f8a; }
  .rvid { display:block; width:auto; max-width:100%; max-height:70vh; margin:0 auto; border-radius:16px; background:#000; border:1px solid #4c2f8a; }
  ol.steps { margin-left:20px; color:var(--muted); font-size:14px; line-height:1.8; }
  .actions { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .act { display:block; text-align:center; text-decoration:none; padding:14px; border-radius:16px; font-weight:800; font-size:15px; }
  .act.ai { background:var(--accent); color:#fff; box-shadow:0 6px 20px rgba(124,58,237,.35); }
  .act.yt { background:transparent; color:#fff; border:2px solid var(--accent2); }
  .act.off { background:#1d1d22; color:#7d7d88; border:2px dashed var(--border); box-shadow:none; pointer-events:none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- Robot 3D ungu (dipakai ulang di login & header) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="rHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd6fe"/><stop offset=".4" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="rVisor" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#3b2a6b"/><stop offset="1" stop-color="#0f0a24"/>
    </radialGradient>
    <radialGradient id="rEye" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <radialGradient id="rBall" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e879f9"/><stop offset="1" stop-color="#a21caf"/>
    </radialGradient>
    <symbol id="robot" viewBox="0 0 100 110">
      <ellipse cx="50" cy="106" rx="24" ry="3.5" fill="#000" opacity=".35"/>
      <rect x="48.5" y="6" width="3" height="12" rx="1.5" fill="#6d28d9"/>
      <circle class="ant" cx="50" cy="6" r="5" fill="url(#rBall)"/>
      <rect x="9" y="34" width="9" height="20" rx="4.5" fill="url(#rBody)"/>
      <rect x="82" y="34" width="9" height="20" rx="4.5" fill="url(#rBody)"/>
      <rect x="14" y="17" width="72" height="50" rx="22" fill="url(#rHead)"/>
      <rect x="18" y="19" width="64" height="12" rx="6" fill="#fff" opacity=".28"/>
      <rect x="22" y="29" width="56" height="28" rx="13" fill="url(#rVisor)"/>
      <rect x="22" y="29" width="56" height="28" rx="13" fill="none" stroke="#c4b5fd" stroke-opacity=".5" stroke-width="1.2"/>
      <ellipse class="eye" cx="38" cy="43" rx="6" ry="7" fill="url(#rEye)"/>
      <ellipse class="eye" cx="62" cy="43" rx="6" ry="7" fill="url(#rEye)"/>
      <circle cx="36" cy="40.5" r="1.8" fill="#fff"/><circle cx="60" cy="40.5" r="1.8" fill="#fff"/>
      <path d="M44 52 Q50 56 56 52" stroke="#67e8f9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <rect x="42" y="66" width="16" height="6" rx="3" fill="#4c1d95"/>
      <rect x="26" y="70" width="48" height="32" rx="16" fill="url(#rBody)"/>
      <ellipse cx="42" cy="77" rx="12" ry="4" fill="#fff" opacity=".25"/>
      <circle cx="50" cy="87" r="6.5" fill="url(#rVisor)" stroke="#c4b5fd" stroke-opacity=".6"/>
      <circle cx="50" cy="87" r="3" fill="#a78bfa"/>
      <g class="arm-l"><rect x="12" y="73" width="12" height="24" rx="6" fill="url(#rBody)"/></g>
      <rect x="76" y="73" width="12" height="24" rx="6" fill="url(#rBody)"/>
    </symbol>
  </defs>
</svg>

<!-- ===== LOGIN ===== -->
<div id="loginView">
  <form class="card" id="f">
    <div class="logo"><svg class="robot" viewBox="0 0 100 110" aria-label="Robot Nifa Animation Academy"><use href="#robot"/></svg></div>
    <h1>Nifa <span>Animation</span><br>Academy<br><small class="ml">Member Login</small></h1>
    <p class="sub">Silakan Login Menggunakan Akun Anda</p>

    <label class="t" for="email">✉️ Email Address</label>
    <div class="field"><input type="email" id="email" placeholder="nama@email.com" required></div>

    <label class="t" for="pw">🔒 Password</label>
    <div class="field">
      <input type="password" id="pw" placeholder="••••••••" required>
      <button type="button" class="eye" id="eye">👁</button>
    </div>

    <label class="remember"><input type="checkbox" checked> Ingat Saya</label>
    <div id="msg"></div>
    <button class="btn" type="submit">Masuk Sekarang →</button>

    <hr>
    <div class="links">
      Belum Memiliki Akun?<br>Lupa Password?<br>
      <a href="https://wa.me/6287824297250" target="_blank" rel="noopener">💬 Hubungi Admin Sekarang</a>
    </div>
  </form>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashView" class="hidden">
  <header>
    <div class="brand"><svg class="robot" viewBox="0 0 100 110" aria-hidden="true"><use href="#robot"/></svg><span class="bt">Nifa <b>Animation</b><small>Academy</small></span></div>
    <div class="user">
      <button class="avatar" id="avatarBtn"><span class="pic" id="initial">N</span> ▾</button>
      <div class="menu" id="menu"><button id="logout">Keluar</button></div>
    </div>
  </header>

  <main>
    <section class="welcome">
      <h2>Selamat datang di Nifa Animation Academy 👋</h2>
      <p id="welcomeText"></p>
      <div class="who" id="hello"></div>
    </section>

    <div class="sec">Materi Belajar <span id="count"></span></div>
    <section id="modules"></section>
  </main>
</div>

<script>
  /* =====================================================
     PENGATURAN (edit bagian ini saja)
     ===================================================== */

  // Kalimat sambutan setelah login
  const WELCOME_TEXT = 'Senang Anda bergabung. Pilih modul di bawah, tonton video belajarnya, lalu praktikkan bersama asisten AI Nifa Core.';

  // Daftar modul. Tambah modul baru dengan menyalin satu blok { ... }, lalu ubah isinya.
  //  title    : judul modul
  //  desc     : deskripsi singkat
  //  image    : gambar hasil karya (mis. 'img/modul1.jpg'). Kosongkan jika belum ada.
  //  video    : file video hasil karya (mis. 'hasil-modul1.mp4'), diupload ke repository yang sama
  //  resultNote: teks keterangan hasil (tampil di atas gambar/placeholder)
  //  steps    : langkah "Cara Menggunakan" (daftar teks)
  //  aiLink   : link asisten AI untuk modul ini (kosong = tampil "Segera hadir")
  //  youtube  : link video YouTube belajar (kosong = tampil "Segera hadir")
  const modules = [
    {
      title: 'Belajar Membuat Animasi 3D',
      desc: 'Pelajari dasar membuat animasi 3D dari nol sampai menghasilkan karya pertama Anda.',
      video: 'hasil-modul1.mp4',
      image: '',
      resultNote: 'Contoh hasil animasi 3D akan ditampilkan di sini',
      steps: [
        'Tonton video belajar di YouTube.',
        'Buka asisten AI dan ikuti contoh perintah (prompt) yang diberikan.',
        'Praktikkan sendiri, lalu simpan hasil animasi Anda.'
      ],
      aiLink: 'https://gemini.google.com/gem/1U5Jh1NdBWaBySyKvlHhZxEiqrZOS5W13?usp=sharing',
      youtube: 'https://youtu.be/C3j5uRd13Mo'
    },
    { title: 'Judul Modul 2', desc: 'Deskripsi modul akan segera ditambahkan.', image:'', resultNote:'', steps:[], aiLink:'', youtube:'' },
    { title: 'Judul Modul 3', desc: 'Deskripsi modul akan segera ditambahkan.', image:'', resultNote:'', steps:[], aiLink:'', youtube:'' },
    { title: 'Judul Modul 4', desc: 'Deskripsi modul akan segera ditambahkan.', image:'', resultNote:'', steps:[], aiLink:'', youtube:'' },
    { title: 'Judul Modul 5', desc: 'Deskripsi modul akan segera ditambahkan.', image:'', resultNote:'', steps:[], aiLink:'', youtube:'' },
    { title: 'Judul Modul 6', desc: 'Deskripsi modul akan segera ditambahkan.', image:'', resultNote:'', steps:[], aiLink:'', youtube:'' },
    { title: 'Judul Modul 7', desc: 'Deskripsi modul akan segera ditambahkan.', image:'', resultNote:'', steps:[], aiLink:'', youtube:'' },
    { title: 'Judul Modul 8', desc: 'Deskripsi modul akan segera ditambahkan.', image:'', resultNote:'', steps:[], aiLink:'', youtube:'' }
  ];

  /* =====================================================
     KODE (tidak perlu diubah)
     ===================================================== */
  let mem = null;
  const store = {
    get(){ try { return localStorage.getItem('nifa_user'); } catch(e){ return mem; } },
    set(v){ mem = v; try { localStorage.setItem('nifa_user', v); } catch(e){} },
    del(){ mem = null; try { localStorage.removeItem('nifa_user'); } catch(e){} }
  };
  const $ = id => document.getElementById(id);

  function render(){
    $('welcomeText').textContent = WELCOME_TEXT;
    $('count').textContent = modules.length + ' modul';
    const wrap = $('modules'); wrap.innerHTML = '';
    modules.forEach((m, i) => {
      const ready = !!(m.aiLink || m.youtube || m.video || (m.steps && m.steps.length) || m.image);
      const bg = m.image ? ` style="background-image:url('${m.image}')"` : '';
      const resultText = m.image ? '' : (m.resultNote || 'Hasil karya akan ditampilkan di sini');
      const steps = (m.steps && m.steps.length)
        ? `<div class="blk"><h4>📖 Cara Menggunakan</h4><ol class="steps">${m.steps.map(s => `<li>${s}</li>`).join('')}</ol></div>` : '';
      const ai = m.aiLink ? `<a class="act ai" href="${m.aiLink}" target="_blank" rel="noopener">🤖 Buka Asisten AI</a>`
                          : `<span class="act ai off">🤖 Asisten AI — Segera hadir</span>`;
      const yt = m.youtube ? `<a class="act yt" href="${m.youtube}" target="_blank" rel="noopener">▶ Tonton di YouTube</a>`
                           : `<span class="act yt off">▶ Video YouTube — Segera hadir</span>`;
      wrap.insertAdjacentHTML('beforeend', `
        <article class="mod${i === 0 ? ' open' : ''}">
          <button class="mhead" type="button">
            <span class="num">MODUL ${i + 1}</span>
            <span class="mtitle">${m.title}${ready ? '' : '<em>Segera hadir</em>'}</span>
            <span class="chev">▾</span>
          </button>
          <div class="mbody">
            <p class="mdesc">${m.desc}</p>
            <div class="blk"><h4>🎬 Hasil</h4>${m.video ? `<video class="rvid" src="${m.video}" controls playsinline preload="metadata"></video>` : `<div class="result"${bg}>${resultText}</div>`}</div>
            ${steps}
            <div class="actions">${ai}${yt}</div>
          </div>
        </article>`);
    });
  }

  function show(){
    const u = store.get();
    $('loginView').classList.toggle('hidden', !!u);
    $('dashView').classList.toggle('hidden', !u);
    if (u){ $('hello').textContent = 'Masuk sebagai ' + u; $('initial').textContent = u[0].toUpperCase(); render(); }
    scrollTo(0,0);
  }

  $('modules').addEventListener('click', e => {
    const h = e.target.closest('.mhead');
    if (h) h.parentElement.classList.toggle('open');
  });
  $('eye').onclick = () => $('pw').type = $('pw').type === 'password' ? 'text' : 'password';
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    if ($('pw').value.length < 6){ $('msg').textContent = 'Password minimal 6 karakter.'; return; }
    // ⚠️ DEMO: login palsu. Ganti dengan Supabase/Firebase Auth untuk produksi.
    store.set($('email').value.trim()); $('msg').textContent = ''; show();
  });
  $('avatarBtn').onclick = () => $('menu').classList.toggle('open');
  $('logout').onclick = () => { store.del(); $('menu').classList.remove('open'); show(); };
  show();

  // Background jaring titik
  const c=$('bg'),x=c.getContext('2d');let pts=[];
  function size(){c.width=innerWidth;c.height=innerHeight;pts=Array.from({length:45},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}));}
  function draw(){x.clearRect(0,0,c.width,c.height);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;});
    for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
      if(d<150){x.strokeStyle=`rgba(255,255,255,${.1*(1-d/150)})`;x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.stroke();}}
      x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(pts[i].x,pts[i].y,2,0,7);x.fill();}
    requestAnimationFrame(draw);}
  addEventListener('resize',size);size();draw();
</script>
</body>
</html>
